/* ===== 2. EDITOR DESIGN SYSTEM ===== */
:root{--bg:#101217;--pn:#171a21;--pn2:#1e222b;--ln:#2a2f3a;--tx:#e7e9ee;--mu:#8e95a5;--ac:#5b8def;--ac2:#7aa3f5;--dn:#ef5b5b;color-scheme:dark}

button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{cursor:pointer;background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:#272c37;border-color:#3a4150}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.pri:hover:not(:disabled){background:var(--ac2)}
button.ghost{background:none;border-color:transparent}button.on{background:#26324d;border-color:var(--ac);color:#fff}button.dng:hover{border-color:var(--dn);color:var(--dn)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
#top{height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex:none}
.logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-right:6px}.logo b{width:22px;height:22px;border-radius:6px;background:var(--ac);display:grid;place-items:center;color:#fff;font-size:12px}
#pname{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;width:170px;font-weight:600}#pname:hover,#pname:focus{border-color:var(--ln);background:var(--bg)}
.sp{flex:1}.grp{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:9px;border:1px solid var(--ln)}.grp button{border:0;background:none;padding:5px 8px}
#st{color:var(--mu);font-size:12px;min-width:104px;text-align:right}#st.u{color:#e9b44c}
#app{flex:1;display:grid;grid-template-columns:262px 1fr 292px;min-height:0}
aside{background:var(--pn);display:flex;flex-direction:column;min-height:0;min-width:0}#left{border-right:1px solid var(--ln)}#right{border-left:1px solid var(--ln)}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;border:0;border-radius:0;background:none;justify-content:center;padding:10px 0;color:var(--mu)}.tabs button.on{color:#fff;box-shadow:inset 0 -2px var(--ac);background:none}
.pane{padding:12px;overflow:auto;flex:1}.pane[hidden]{display:none}
.pane h4{margin:14px 0 8px;font-size:11px;color:var(--mu);font-weight:600}.pane h4:first-child{margin-top:0}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cg button{flex-direction:column;padding:12px 6px;gap:6px;font-size:12px}
.tc{border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--pn2)}.tc b{display:block}.tc p{margin:4px 0 10px;color:var(--mu)}.tc div{display:flex;gap:6px}
.ly{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;user-select:none}.ly:hover{background:var(--pn2)}.ly.on{background:#26324d;border-color:var(--ac)}.ly.ov{border-top:2px solid var(--ac)}.ly small{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{display:flex;flex-direction:column;gap:8px}.pbtn button{justify-content:flex-start}
.fl{display:block;margin-bottom:10px}.fl>span:first-child{display:block;color:var(--mu);font-size:11.5px;margin-bottom:3px}
.fl input,.fl select,.fl textarea,.f2 input{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:7px;padding:6px 8px}.fl textarea{resize:vertical}.fl .bad{border-color:var(--dn)}
.err{display:block;color:var(--dn);font-size:11px;min-height:0}.cf{display:flex;gap:6px}.cf input[type=color]{width:40px;padding:2px;height:30px;flex:none;cursor:pointer}
details{border-bottom:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:600;padding:4px 0;margin-bottom:6px}
.ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.ih div{display:flex;gap:4px}.ih button{padding:6px}
.emp{text-align:center;color:var(--mu);padding:30px 10px}.emp svg{width:30px;height:30px;margin-bottom:8px}
#stage{overflow:auto;background:#262a33 radial-gradient(#323843 1px,transparent 1px) 0 0/18px 18px;padding:22px;min-width:0}
#frame{margin:0 auto;background:#fff;box-shadow:0 10px 40px #0007;border-radius:6px;overflow:hidden;width:100%;transition:max-width .25s;min-height:200px}
#empty{padding:80px 20px;text-align:center;color:#6b7280;font-size:15px}
#site .b{cursor:pointer}#site .b:hover{outline:1px dashed var(--ac);outline-offset:-1px}#site .b.sel{outline:2px solid var(--ac);outline-offset:-2px}
#pv{position:fixed;inset:0;background:#262a33;z-index:50;display:flex;flex-direction:column}#pv[hidden]{display:none}
#pvbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}#pvwrap{flex:1;overflow:auto;padding:18px}#pvw{margin:0 auto;background:#fff;transition:max-width .25s}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:80;padding:16px}#modal[hidden]{display:none}
.md{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}.md h3{margin:0 0 10px;font-size:16px}.mb{overflow:auto;color:#c5cad6}.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.tp{width:100%;height:60vh;border:1px solid var(--ln);border-radius:8px;background:#fff}.md:has(.tp){width:min(900px,100%)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center}
.ts{background:#2b3140;border:1px solid #3d4558;padding:9px 14px;border-radius:9px;box-shadow:0 6px 24px #0008;display:flex;gap:12px;align-items:center;animation:in .2s}.ts button{padding:3px 8px}@keyframes in{from{opacity:0;transform:translateY(8px)}}
[data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:11px;padding:3px 7px;border-radius:5px;white-space:nowrap;z-index:70;pointer-events:none}
@media(max-width:1100px){#app{grid-template-columns:220px 1fr 250px}#pname{width:110px}}
@media(max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr) auto;overflow:auto}aside{max-height:300px}#left{border:0;border-bottom:1px solid var(--ln);order:1}#stage{order:2}#right{order:3;border:0;border-top:1px solid var(--ln)}#top{overflow-x:auto}.hm{display:none!important}body{overflow:auto}}
</style>
<style id="sitecss">
/* ===== EXPORTED SITE STYLES (scoped to .site; container queries give responsive layout) ===== */
.site{container-type:inline-size;font:17px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1f2937;background:#fff}
.site *{box-sizing:border-box}.site .b{padding:var(--p,0);margin-inline:auto;max-width:100%;overflow-wrap:anywhere}
.site h1,.site h2,.site h3,.site p{margin:0}.site .in{max-width:1100px;margin:0 auto}
.site img{display:inline-block;vertical-align:top;max-width:100%;height:auto}.site .bad{background:#e5e7eb;min-height:140px;min-width:140px}
.site .in h2{font-size:min(2em,9cqw);line-height:1.2;margin-bottom:.4em}.site .in p{max-width:68ch}
.site .al-center .in p{margin-inline:auto}.site .al-right .in p{margin-left:auto}
.site .btn{display:inline-block;margin-top:1.4em;padding:.75em 1.6em;border-radius:10px;font-weight:600;text-decoration:none;line-height:1.2;transition:filter .15s}
.site .b-button .btn{margin:0}.site .btn:hover{filter:brightness(.92)}.site a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.site .cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.site .cols img{width:100%;border-radius:14px}
.site .grid{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:20px;margin-top:32px;text-align:left}
.site .card{background:#fff;color:#1f2937;border:1px solid #e5e7eb;border-radius:14px;padding:24px}.site .card h3{font-size:1.15em;margin-bottom:.4em}.site .card p{opacity:.8;font-size:.95em}
.site .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.site .brand{font-size:1.25em;font-weight:700}
.site .links a{color:inherit;text-decoration:none;margin-left:22px;opacity:.85}.site .links a:hover{opacity:1}
.site footer .in{display:flex;flex-direction:column;gap:10px;align-items:center}.site footer .links a{margin:0 10px}
@container (max-width:760px){.site .cols{grid-template-columns:1fr;gap:28px}.site .grid{grid-template-columns:repeat(2,1fr)}.site .b{padding:calc(var(--p,0px)*.6)}}
@container (max-width:480px){.site .grid{grid-template-columns:1fr}.site .nav{flex-direction:column;align-items:flex-start}.site .links a{margin:0 18px 0 0}}
</style></head>

/* ===== SANITISING / VALIDATION ===== */
function cleanVal(k,v,d){const sp=SP[k];try{switch(sp[1]){
 case 'a':case 't':return String(v??'').slice(0,5000);
 case 'u':return k==='src'?safeUrl(v,1):safeUrl(v);
 case 'c':v=String(v??'').trim();return v===''?'':hex(v)?full(v):d;
 case 'n':{v=Number(v);return isFinite(v)?Math.min(sp[3],Math.max(sp[2],Math.round(v*10)/10)):d}
 case 's':return sp[2].includes(String(v))?String(v):d}}catch(e){}return d}
function clean(o){if(!o||typeof o!=='object'||!Array.isArray(o.nodes))throw new Error('Not a WebCraft project file');
 const seen=new Set(),nodes=o.nodes.slice(0,300).map(n=>{if(!n||!DEF[n.type])throw new Error('Unknown component type');
  const p={};for(const k in DEF[n.type])p[k]=n.p&&k in n.p?cleanVal(k,n.p[k],DEF[n.type][k]):DEF[n.type][k];
  let id=typeof n.id==='string'&&/^[\w-]{1,20}$/.test(n.id)&&!seen.has(n.id)?n.id:uid();seen.add(id);return{id,type:n.type,p}});
 return{name:String(o.name||'Untitled site').slice(0,80),title:String(o.title||o.name||'My website').slice(0,120),nodes}}
const blank=()=>({name:'Untitled site',title:'My website',nodes:[]});
const starter=()=>({name:'My website',title:'Northwind — Business consulting',nodes:TPL[0].build()});

const MAP=[['font','font-family',v=>FONTS[v]],['size','font-size',v=>v>28?`min(${v}px,${(v/4.5).toFixed(1)}cqw)`:v+'px'],['weight','font-weight',v=>v],['align','text-align',v=>v],['color','color',v=>v],['lh','line-height',v=>v],['bg','background',v=>v],['r','border-radius',v=>v+'px'],['op','opacity',v=>v/100],['mt','margin-top',v=>v+'px'],['mb','margin-bottom',v=>v+'px'],['w','width',v=>v+'%'],['h','height',v=>v+'px']];
function css(p,keys,x=''){const ok=k=>p[k]!==undefined&&p[k]!==''&&(!keys||keys.includes(k));
 const o=MAP.filter(m=>ok(m[0])).map(m=>m[1]+':'+m[2](p[m[0]]));if(ok('pad'))o.push('--p:'+p.pad+'px');
 if(p.bw>0&&ok('bw')&&p.bd)o.push('border:'+p.bw+'px solid '+p.bd);return o.join(';')+(x?';'+x:'')}
let ctx={};
function blk(n,tag,inner,cls='',keys,x){const p=n.p,sid=ctx.e?'':slug(p.text||p.brand||'');
 return`<${tag} class="b b-${n.type} ${cls} al-${p.align||'left'}${ctx.sel===n.id?' sel':''}"${ctx.e?` data-id="${n.id}"`:''}${sid?` id="${sid}"`:''} style="${css(p,keys,x)}">${inner}</${tag}>`}
const link=(h,t,st='',c='')=>`<a ${c?`class="${c}" `:''}href="${esc(safeUrl(h))}" rel="noopener"${st?` style="${st}"`:''}>${esc(t)}</a>`;
const cta=n=>n.p.label?link(n.p.href,n.p.label,`background:${n.p.ac};color:${ink(n.p.ac)}`,'btn'):'';
const pic=(s,a)=>{const u=safeUrl(s,1);return u?`<img src="${esc(u)}" alt="${esc(a)}" loading="lazy" onerror="this.removeAttribute('src');this.classList.add('bad')">`:`<img class="bad" alt="${esc(a)}">`};
const LINKS=s=>lines(s).map(l=>link(l[1]||'#',l[0])).join('');
const R={
heading:n=>blk(n,ctx.h1++?'h2':'h1',tx(n.p.text)),
paragraph:n=>blk(n,'p',tx(n.p.text)),
button:n=>blk(n,'div',link(n.p.href,n.p.label,css(n.p,['font','size','weight','color','bg','r','op','bd','bw']),'btn'),'',['align','pad','mt','mb']),
image:n=>blk(n,'div',pic(n.p.src,n.p.alt).replace('<img','<img style="'+css(n.p,['r','op','w','bd','bw'])+'"'),'',['align','pad','mt','mb']),
nav:n=>blk(n,'nav',`<div class="in nav"><strong class="brand">${esc(n.p.brand)}</strong><div class="links">${LINKS(n.p.items)}</div></div>`,'',undefined,n.p.bw>0?'border-width:0 0 '+n.p.bw+'px':''),
section:n=>blk(n,'section',`<div class="in"><h2>${esc(n.p.text)}</h2><p>${tx(n.p.sub)}</p>${cta(n)}</div>`),
cols:n=>blk(n,'section',`<div class="in cols"><div><h2>${esc(n.p.text)}</h2><p>${tx(n.p.sub)}</p>${cta(n)}</div><div>${pic(n.p.src,n.p.alt)}</div></div>`),
grid:n=>blk(n,'section',`<div class="in"><h2>${esc(n.p.text)}</h2><div class="grid" style="--c:${n.p.cols}">${lines(n.p.items).map(l=>`<div class="card"><h3>${esc(l[0])}</h3><p>${esc(l[1])}</p></div>`).join('')}</div></div>`),
divider:n=>blk(n,'div',`<hr style="border:0;border-top:${n.p.bw}px solid ${n.p.bd};margin:0">`,'',['mt','mb','w']),
spacer:n=>`<div class="b b-spacer${ctx.sel===n.id?' sel':''}"${ctx.e?` data-id="${n.id}"`:' aria-hidden="true"'} style="${css(n.p)}"></div>`,
footer:n=>blk(n,'footer',`<div class="in"><p>${tx(n.p.text)}</p><div class="links">${LINKS(n.p.items)}</div></div>`)};
const html=(nodes,e)=>{ctx={e,h1:0,sel:e?sel:null};return nodes.map(n=>R[n.type](n)).join('')};
const siteCss=()=>$('#sitecss').textContent.replace(/\/\*[\s\S]*?\*\//g,'').trim();
const head=p=>`<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.title||p.name)}</title>`;
function pageDoc(p,linked){const body=html(p.nodes,0);return`<!DOCTYPE html>\n<html lang="en"><head>${head(p)}${linked?'<link rel="stylesheet" href="style.css">':`<style>\nhtml,body{margin:0}\n${siteCss()}\n</style>`}</head>\n<body><div class="site">\n${body}\n</div></body></html>`}

let S=load(),sel=null,dev='desktop',hist=[],fut=[],lastK='',lastT=0,dirty=false,saveTm=0,modalDone=null;

function load(){try{const r=localStorage.getItem(KEY);if(r)return clean(JSON.parse(r))}catch(e){}return starter()}

function canvas(){const s=$('#site');s.innerHTML=html(S.nodes,1);s.hidden=!S.nodes.length;$('#empty').hidden=!!S.nodes.length;
 $('#frame').style.maxWidth={desktop:'none',tablet:'768px',mobile:'390px'}[dev]}
function select(id,scroll){sel=id;$$('#site .sel').forEach(e=>e.classList.remove('sel'));const el=id&&$(`#site [data-id="${id}"]`);if(el){el.classList.add('sel');if(scroll)el.scrollIntoView({block:'nearest',behavior:'smooth'})}layers();inspector()}

function layers(){const el=$('#p-lay');el.innerHTML=S.nodes.length?`<h4>Page structure — drag to reorder</h4>`+S.nodes.map(n=>`<div class="ly${n.id===sel?' on':''}" draggable="true" data-lid="${n.id}" role="button" tabindex="0" aria-pressed="${n.id===sel}">${ic(n.type)}<span>${NAMES[n.type]}</span><small>${esc(snippet(n))}</small></div>`).join(''):'<div class="emp">'+ic('layers')+'<p>No components yet.</p></div>'}
function fld(n,k){const sp=SP[k],v=n.p[k];let c;
 if(sp[1]==='a')c=`<textarea data-k="${k}" rows="${k==='items'?5:3}">${esc(v)}</textarea>`;
 else if(sp[1]==='t'||sp[1]==='u')c=`<input data-k="${k}" value="${esc(v)}"${sp[1]==='u'?' inputmode="url" placeholder="https://… or #section"':''}>`;
 else if(sp[1]==='s')c=`<select data-k="${k}">${sp[2].map(o=>`<option value="${o}"${o===String(v)?' selected':''}>${FN[o]||o}</option>`).join('')}</select>`;
 else if(sp[1]==='n')c=`<input type="number" data-k="${k}" value="${v}" min="${sp[2]}" max="${sp[3]}" step="${sp[4]||1}">`;
 else c=`<span class="cf"><input type="color" data-k="${k}" value="${v||'#ffffff'}" aria-label="${sp[0]} picker"><input data-k="${k}" value="${v}" placeholder="none" maxlength="7" aria-label="${sp[0]} hex value"></span>`;
 return`<label class="fl"><span>${k==='items'?LBL[n.type]:sp[0]}</span>${c}<small class="err"></small></label>`}
function inspector(){const n=find(sel),el=$('#insp');
 if(!n){el.innerHTML='<div class="emp">'+ic('cog')+'<p><b>Nothing selected</b></p><p>Click a block on the page or in Layers to edit its content and style.</p></div>';return}
 el.innerHTML=`<div class="ih"><b>${NAMES[n.type]}</b><div><button data-a="up" data-tip="Move up" aria-label="Move up">${ic('up')}</button><button data-a="down" data-tip="Move down" aria-label="Move down">${ic('down')}</button><button data-a="dup" data-tip="Duplicate" aria-label="Duplicate">${ic('dup')}</button><button data-a="del" class="dng" data-tip="Delete" aria-label="Delete">${ic('del')}</button></div></div>`+
 FLD[n.type].map(([g,ks],i)=>`<details${i<2?' open':''}><summary>${g}</summary>${ks.map(k=>fld(n,k)).join('')}</details>`).join('')}
function flag(el,msg){const s=el.closest('label').querySelector('.err');s.textContent=msg||'';el.classList.toggle('bad',!!msg)}
function onField(el,final){const n=find(sel),k=el.dataset.k;if(!n||!k)return;const sp=SP[k];let v=el.value;
 if(sp[1]==='c'){v=v.trim();if(el.type==='text'){if(v!==''&&!hex(v)){if(final){el.value=n.p[k];flag(el)}else flag(el,'Use a hex colour like #4f46e5');return}flag(el);if(v)v=full(v)}}
 else if(sp[1]==='n'){const x=parseFloat(v);if(isNaN(x)||x<sp[2]||x>sp[3]){if(final){el.value=n.p[k];flag(el)}else flag(el,`Enter a number from ${sp[2]} to ${sp[3]}`);return}flag(el);v=x}
 else if(sp[1]==='u'){flag(el,v.trim()&&safeUrl(v,k==='src')!==v.trim()?'Only http(s), mailto, tel, # and relative links are allowed':'')}
 if(n.p[k]===v)return;snap('p'+n.id+k);n.p[k]=v;
 if(sp[1]==='c'){const cf=el.closest('.cf');cf.children[0].value=v||'#ffffff';if(el.type==='color')cf.children[1].value=v}
 changed()}
function act(a){const i=S.nodes.findIndex(n=>n.id===sel);if(i<0)return;
 if(a==='del'){snap();const[n]=S.nodes.splice(i,1);sel=(S.nodes[i]||S.nodes[i-1]||{}).id||null;all();toast(NAMES[n.type]+' deleted',undo);return}
 if(a==='dup'){snap();const c=JSON.parse(JSON.stringify(S.nodes[i]));c.id=uid();S.nodes.splice(i+1,0,c);sel=c.id}
 else{const j=a==='up'?i-1:i+1;if(j<0||j>=S.nodes.length)return;snap();[S.nodes[i],S.nodes[j]]=[S.nodes[j],S.nodes[i]]}
 all();select(sel,1)}
function addNode(t){snap();const n=N(t),i=S.nodes.findIndex(x=>x.id===sel);S.nodes.splice(i<0?S.nodes.length:i+1,0,n);sel=n.id;all();select(n.id,1)}

/* ===== TOASTS & MODALS ===== */
function toast(msg,fn){const t=document.createElement('div');t.className='ts';t.setAttribute('role','status');t.append(msg);
 if(fn){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{fn();t.remove()};t.append(b)}
 $('#toasts').append(t);setTimeout(()=>t.remove(),fn?6000:3500)}
function modal(title,body,acts){return new Promise(res=>{const m=$('#modal');
 m.innerHTML=`<div class="md" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mb">${body}</div><div class="ma">${acts.map(a=>`<button class="${a[2]||''}" data-v="${a[1]}">${a[0]}</button>`).join('')}</div></div>`;m.hidden=false;
 const done=v=>{m.hidden=true;m.innerHTML='';m.onclick=null;modalDone=null;res(v)};modalDone=done;
 m.onclick=e=>{const b=e.target.closest('[data-v]');if(b)done(b.dataset.v);else if(e.target===m)done(null)};$$('button',m).pop().focus()})}

function importFile(f){if(!f)return;if(f.size>3e6)return toast('That file is too large to be a WebCraft project');
 const r=new FileReader();r.onerror=()=>toast('Could not read that file');
 r.onload=()=>{let p;try{p=clean(JSON.parse(r.result))}catch(e){return toast('Import failed: '+(e.message||'invalid file'))}replaceProject(p,'Project imported')};r.readAsText(f)}

/* ===== 9. PREVIEW, EVENTS, INIT ===== */
function preview(on){$('#pv').hidden=!on;if(on){$('#pvs').innerHTML=html(S.nodes,0);setDev(dev);$('#pvback').focus()}}
document.addEventListener('click',e=>{const t=e.target;
 let b=t.closest('[data-dev]');if(b)return setDev(b.dataset.dev);
 if(b=t.closest('[data-tab]'))return tab(b.dataset.tab);
 if(b=t.closest('[data-add]'))return addNode(b.dataset.add);
 if(b=t.closest('[data-tp]'))return previewTpl(b.dataset.tp);
 if(b=t.closest('[data-tu]'))return useTpl(b.dataset.tu);
 if(b=t.closest('#insp [data-a]'))return act(b.dataset.a);
 if(b=t.closest('[data-lid]'))return select(b.dataset.lid,1);
 if(b=t.closest('[data-pj]')){const a=b.dataset.pj;return a==='save'?save(1):a==='new'?replaceProject(blank(),'New project started'):a==='reset'?replaceProject(starter(),'Starter project restored'):a==='json'?exportJson():a==='imp'?$('#file').click():exportHtml()}
 if(t.closest('#site')){e.preventDefault();const n=t.closest('[data-id]');return select(n?n.dataset.id:null)}
 if(t.closest('#pvs')){const a=t.closest('a');if(a){e.preventDefault();const h=a.getAttribute('href')||'';if(h[0]==='#'){const el=h.length>1&&document.getElementById(h.slice(1));if(el&&$('#pvs').contains(el))el.scrollIntoView({behavior:'smooth'})}else window.open(h,'_blank','noopener')}}
 if(t.closest('#stage')&&!t.closest('#frame'))select(null)});
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#bprev').onclick=()=>preview(1);$('#pvback').onclick=()=>preview(0);$('#bexp').onclick=exportDialog;$('#bimp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};
$('#pname').oninput=e=>{S.name=e.target.value.slice(0,80);touch()};
$('#p-prj').addEventListener('input',e=>{if(e.target.id==='ptitle'){S.title=e.target.value;touch()}});
$('#insp').addEventListener('input',e=>onField(e.target,0));$('#insp').addEventListener('change',e=>onField(e.target,1));
/* layer drag-and-drop reorder (delegated) */
let dragId=null;const lp=$('#p-lay');
lp.addEventListener('dragstart',e=>{const r=e.target.closest('[data-lid]');if(r){dragId=r.dataset.lid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});
lp.addEventListener('dragover',e=>{const r=e.target.closest('[data-lid]');if(r&&dragId){e.preventDefault();$$('.ov',lp).forEach(x=>x.classList.remove('ov'));r.classList.add('ov')}});
lp.addEventListener('drop',e=>{e.preventDefault();const r=e.target.closest('[data-lid]');if(!r||!dragId||r.dataset.lid===dragId)return;
 const a=S.nodes.findIndex(n=>n.id===dragId),b=S.nodes.findIndex(n=>n.id===r.dataset.lid);snap();const[m]=S.nodes.splice(a,1);S.nodes.splice(b,0,m);dragId=null;all()});
lp.addEventListener('dragend',()=>{dragId=null;$$('.ov',lp).forEach(x=>x.classList.remove('ov'))});
lp.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.lid){e.preventDefault();select(e.target.dataset.lid,1)}});
document.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
 if(e.key==='Escape'){if(modalDone)modalDone(null);else if(!$('#pv').hidden)preview(0);return}
 if(modalDone)return;
 if(m&&k==='s'){e.preventDefault();save(1)}
 else if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&k==='y'){e.preventDefault();redo()}
 else if((e.key==='Delete'||e.key==='Backspace')&&!typing&&sel&&$('#pv').hidden){e.preventDefault();act('del')}});
addEventListener('pagehide',()=>{if(dirty)save()});
buildPanes();setDev('desktop');canvas();layers();inspector();tools();stat();
</script></body></html>
